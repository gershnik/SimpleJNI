[versions]
jniGen = '3.16'
cmake = '4.1.2'
compileSdk = '36'
minSdk = '23'
targetSdk = '36'
kotlin = '2.3.21'
agp = "9.2.1"
ksp = '2.3.9'

[libraries]
smjni-jnigen-annotations = { group = "io.github.gershnik", name = "smjni-jnigen-annotations", version.ref = "jniGen" }
smjni-jnigen-processor = { group = "io.github.gershnik", name="smjni-jnigen-processor", version.ref = "jniGen" }
smjni-jnigen-kprocessor = { group = "io.github.gershnik", name="smjni-jnigen-kprocessor", version.ref = "jniGen" }

builtin-kotlin-android = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref ="kotlin"}

androidx-appcompat = 'androidx.appcompat:appcompat:1.7.1'
android-material = 'com.google.android.material:material:1.13.0'
androidx-constraintlayout = 'androidx.constraintlayout:constraintlayout:2.2.1'
androidx-junit = 'androidx.test.ext:junit:1.3.0'
androidx-espresso-core = 'androidx.test.espresso:espresso-core:3.7.0'
androidx-core-ktx = 'androidx.core:core-ktx:1.18.0'
androidx-lifecycle-runtime-ktx = "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
androidx-activity-compose = "androidx.activity:activity-compose:1.13.0"
androidx-compose-bom = "androidx.compose:compose-bom:2026.04.01"
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }


junit = 'junit:junit:4.13.2'

[plugins]
android-application = { id = 'com.android.application', version.ref = 'agp' }
kotlin-compose = { id = 'org.jetbrains.kotlin.plugin.compose', version.ref = 'kotlin' }
android-kapt = { id = 'com.android.legacy-kapt', version.ref = 'agp' }
google-devtools-ksp = { id = 'com.google.devtools.ksp', version.ref = 'ksp' }
